name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors here. The crate builds clean under this on every feature
  # combination below, so a new one means something actually regressed.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # The regression suite pins numerical fidelity against the original R
      # package's fixtures, and tests/order_invariance.rs pins that renaming or
      # reordering the input columns leaves the network unchanged. The whole
      # suite is about a second, so it gates every push.
      - name: Test
        run: cargo test --release

      # The server and the wasm module are separate feature combinations and
      # have broken independently before -- the wasm one as recently as the
      # commit that added this workflow.
      - name: Build the local server (--features web)
        run: cargo build --release --features web --bin xscalenet-web

      - name: Type-check the wasm feature
        run: cargo check --lib --no-default-features --features wasm

      # web/wasm/xscalenet_bg.wasm is a committed binary that the frontend loads
      # whenever no local server is running -- and it had silently gone stale by
      # seven commits, so the browser-only path was reconstructing with the
      # pre-fix, column-order-dependent engine while every other path had been
      # fixed. Nothing pointed that out. This does: if any commit touching src/
      # is newer than the last commit that refreshed the artefact, the build
      # needs ./scripts/build-wasm.sh re-run and the result committed.
      - name: Check the committed wasm is not stale
        if: runner.os == 'Linux'
        run: |
          src_commit=$(git log -1 --format=%H -- src/)
          wasm_commit=$(git log -1 --format=%H -- web/wasm/xscalenet_bg.wasm)
          if ! git merge-base --is-ancestor "$src_commit" "$wasm_commit"; then
            echo "::error::web/wasm/xscalenet_bg.wasm predates the engine it ships."
            echo "  last src/ change:  $(git log -1 --format='%h %ad %s' --date=short -- src/)"
            echo "  last wasm rebuild: $(git log -1 --format='%h %ad %s' --date=short -- web/wasm/xscalenet_bg.wasm)"
            echo "  fix: ./scripts/build-wasm.sh release && git add web/wasm"
            exit 1
          fi
          echo "wasm artefact is current with src/"


  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned on purpose. Clippy gains lints with every release, so running it
      # on `stable` means a toolchain bump can turn this job red on code nobody
      # touched -- which is how a gate stops being trusted. Bump this
      # deliberately, with the fixes in the same commit. Reproduce locally with
      #   rustup toolchain install 1.99 && cargo +1.99 clippy --release --all-targets
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets

  # Deliberately no `cargo fmt --check`: the crate has never been
  # rustfmt-formatted, and running it would rewrite 24 files. Worth doing, but
  # as its own change rather than hidden inside an unrelated pull request.
