name: CI

on:
  push:
    branches: [modernize-and-benchmark, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # The regression suite pins numerical fidelity against the original R
      # package's fixtures, and tests/order_invariance.rs pins that renaming or
      # reordering the input columns leaves the network unchanged. Both are
      # cheap -- the whole suite is about a second -- so they gate every push.
      - name: Test
        run: cargo test --release

      # The server and the wasm module are separate feature combinations and
      # have broken independently before; building them here keeps that honest.
      - name: Build the local server (--features web)
        run: cargo build --release --features web --bin xscalenet-web

      - name: Type-check the wasm feature
        run: cargo check --lib --no-default-features --features wasm

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory, not gating. The codebase predates both tools: `cargo fmt
    # --check` does not pass, and clippy reports warnings in code untouched by
    # recent work. Making these gate means reformatting the crate and clearing
    # those warnings first -- worth doing, but as its own change rather than
    # silently inside a CI commit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --release --all-targets
      - name: Formatting
        run: cargo fmt --check
