[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "xscalenet"
version = "0.3.0"
description = "Efficient network reconstruction + functional-layer analysis (ScaleNet / IntegraNet)"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
