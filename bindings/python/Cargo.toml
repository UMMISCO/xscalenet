[package]
name = "xscalenet-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for xscalenet"
license = "GPL-3.0-or-later"

[lib]
name = "xscalenet"
crate-type = ["cdylib"]

[dependencies]
xscalenet = { path = "../.." }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
