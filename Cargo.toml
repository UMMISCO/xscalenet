[package]
name = "xscalenet"
version = "0.1.0"
edition = "2021"
description = "Efficient Rust reimplementation of the ScaleNet network reconstruction + Spectral Consensus Strategy (core path)"
license = "GPL-3.0-or-later"

# cdylib for the wasm-bindgen module; rlib kept so the bins/tests still link the lib.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xscalenet"
path = "src/main.rs"

# Local reconstruction server (raw matrix -> graph.json), built only with `--features web`.
[[bin]]
name = "xscalenet-web"
path = "src/bin/web.rs"
required-features = ["web"]

[features]
default = ["parallel"]
# Multi-threaded core (Rayon). On by default; turn OFF for single-thread targets
# like wasm32 (`--no-default-features --features wasm`), which use a sequential shim.
parallel = ["dep:rayon"]
# Rich graph.json builder shared by the server and the wasm build.
graphjson = ["dep:serde_json"]
# `xscalenet-web` server: axum + tokio + static file serving + JSON building.
web = ["parallel", "graphjson", "dep:axum", "dep:tokio", "dep:tower-http"]
# In-browser reconstruction: compile the core to wasm32 with wasm-bindgen glue.
# Build with: `cargo build --lib --no-default-features --features wasm --target wasm32-unknown-unknown`.
wasm = ["graphjson", "dep:wasm-bindgen"]

[dependencies]
nalgebra = "0.33"
rayon = { version = "1.10", optional = true }
wasm-bindgen = { version = "=0.2.126", optional = true }
libm = "0.2"
# Pure-Rust gzip (miniz_oxide backend) so `.gz` input works with no system deps.
flate2 = "1"
axum = { version = "0.7", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Only used by the `graph_atc` example to read/enrich an existing graph.json.
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
